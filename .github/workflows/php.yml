name: PHP CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl, json, mbstring

      - name: Validate PHP syntax
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; 2>&1 | (! grep -v "No syntax errors")

      - name: Create data directory
        run: mkdir -p data && chmod 775 data

      - name: Verify bootstrap loads
        run: php -r "define('INSTALL_MODE', true); require 'bootstrap.php'; echo 'Bootstrap OK\n';"
